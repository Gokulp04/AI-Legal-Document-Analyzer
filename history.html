<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Document History</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
            border-radius:10px;
            overflow:hidden;
        }

        th,
        td{
            padding:15px;
            border-bottom:1px solid #ddd;
            text-align:left;
        }

        th{
            background:#2563eb;
            color:white;
        }

        tr:hover{
            background:#f7f9fc;
        }

        .summary{
            max-width:350px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .view-btn{

            display:inline-block;

            background:#16a34a;

            color:white;

            text-decoration:none;

            padding:8px 15px;

            border-radius:6px;

            transition:.3s;

        }
        .delete-btn{

    display:inline-block;

    background:#dc2626;

    color:white;

    text-decoration:none;

    padding:8px 15px;

    border-radius:6px;

    margin-left:8px;

    transition:.3s;

}

.delete-btn:hover{

    background:#b91c1c;

}

        .view-btn:hover{

            background:#15803d;

        }

        .btn{

            display:inline-block;

            margin-top:25px;

            background:#2563eb;

            color:white;

            text-decoration:none;

            padding:12px 20px;

            border-radius:8px;

            transition:.3s;

        }

        .btn:hover{

            background:#1d4ed8;

        }

    </style>

</head>

<body>

<div class="container">

<h1>📄 Document History</h1>
<form method="GET" action="/history">

    <input 
    type="text"
    name="search"
    placeholder="🔍 Search Document..."
    style="
    width:300px;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    ">


    <button 
    type="submit"
    style="
    padding:12px 20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    ">

    Search

    </button>

</form>

<br>

<table>

<tr>

    <th>ID</th>

    <th>Filename</th>

    <th>Summary</th>

    <th>Action</th>

</tr>

{% for doc in documents %}

<tr>

    <td>{{ doc.id }}</td>

    <td>{{ doc.filename }}</td>

    <td class="summary">

        {{ doc.summary }}

    </td>

<td>

    <a href="{{ url_for('view_summary', id=doc.id) }}"
       class="view-btn">

        👁 View Full Summary

    </a>

    <a href="{{ url_for('delete_document', id=doc.id) }}"
       class="delete-btn"
       onclick="return confirm('Are you sure you want to delete this document?');">

        🗑 Delete

    </a>

</td>
</tr>

{% endfor %}

</table>

<a href="{{ url_for('dashboard') }}" class="btn">

    ⬅ Back to Dashboard

</a>

</div>

</body>

</html>
