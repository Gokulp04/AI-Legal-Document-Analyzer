<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#f4f6f9;

}

.card{

margin-top:60px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.profile{

font-size:90px;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card p-4">

<div class="profile">

👤

</div>

<h2 class="text-center">

{{user.name}}

</h2>

<hr>

<p>

<strong>Email :</strong>

{{user.email}}

</p>

<p>

<strong>Total Uploads :</strong>

{{upload_count}}

</p>

<p>

<strong>User ID :</strong>

{{user.id}}

</p>

<div class="text-center">

<a href="/dashboard"

class="btn btn-primary">

Back to Dashboard

</a>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
