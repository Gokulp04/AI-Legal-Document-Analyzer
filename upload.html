<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Legal Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type=file] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 2px dashed #999;
            border-radius: 10px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>

</head>

<body>

<div class="card">

    <h2>📄 Upload Legal Document</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="pdf"
            accept=".pdf"
            required
        >

        <button type="submit">
            Analyze Document
        </button>

    </form>

</div>

</body>
</html>
