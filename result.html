<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Legal Analysis Result</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fb;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 20px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:25px;
        }

        h2{
            margin-top:25px;
            margin-bottom:10px;
            color:#333;
        }

        pre{
            white-space:pre-wrap;
            line-height:1.7;
            font-size:16px;
        }

        .chat{
            margin-top:40px;
        }

        input{
            width:75%;
            padding:15px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
        }

        .btn{
            padding:15px 25px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            margin-left:10px;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .download-btn{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
        }

        .answer{
            margin-top:30px;
            padding:20px;
            background:#eef5ff;
            border-left:5px solid #2563eb;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🤖 AI Legal Document Analysis Report</h1>

        <h2>Analysis Result</h2>

        <pre>{{ summary }}</pre>

        <div class="chat">

            <h2>Ask AI About This Document</h2>

            <form action="/ask" method="POST">

                <input
                    type="text"
                    name="question"
                    placeholder="Example: What is the salary?"
                    required>

                <button type="submit" class="btn">
                    Ask AI
                </button>

            </form>

            <!-- Download button OUTSIDE the form -->
            <a href="/download_report" class="download-btn">
                <button type="button" class="btn">
                    📄 Download AI Report
                </button>
            </a>

            {% if answer %}

            <div class="answer">

                <h2>AI Answer</h2>

                <p>{{ answer }}</p>

            </div>

            {% endif %}

        </div>

    </div>

</div>

</body>

</html>
